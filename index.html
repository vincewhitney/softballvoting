<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treasure Coast Softball Vote</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7f9;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      line-height: 1.2;
    }

    .poll-wrap {
      overflow-x: auto;
    }

    .direct-link {
      display: inline-block;
      margin-top: 18px;
      color: #145ea8;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Treasure Coast Softball Vote</h1>
    <div class="poll-wrap">
      <script src="https://secure.polldaddy.com/p/17024126.js"></script>
      <noscript>
        <a href="https://poll.fm/17024126">Vote here</a>
      </noscript>
      <script>
        function selectLoriMiller() {
          const loriMillerInput = document.querySelector('input[value="74465412"]');

          if (!loriMillerInput) {
            setTimeout(selectLoriMiller, 250);
            return;
          }

          loriMillerInput.checked = true;
          loriMillerInput.dispatchEvent(new Event("change", { bubbles: true }));
          loriMillerInput.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        selectLoriMiller();
      </script>
    </div>
    <a class="direct-link" href="https://poll.fm/17024126">Open the poll directly</a>
  </main>
</body>
</html>
